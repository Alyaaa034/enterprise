services:
  product-service:
    build: ./product-service
    ports:
      - "3003:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PORT=3306
      - DB_PASSWORD=password
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy
  product-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u=root", "--password=rootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  review-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: apppassword
    volumes:
      - review-db-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

  review-service:
    build: ./review-service
    ports:
      - "3004:3002"
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      FLASK_DEBUG: "1"
      MONGO_URI: mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      MONGO_DB_NAME: reviewdb
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_started


volumes:
  product-db-data:
  review-db-data: