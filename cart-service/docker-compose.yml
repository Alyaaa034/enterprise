services:
  cart-service:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - PRODUCT_SERVICE_URL=http://host.docker.internal:3000
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
